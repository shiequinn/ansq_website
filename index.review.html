<!-- Reviews Section -->
<div class="reviews-header">
  <h2>CLIENT REVIEWS</h2>
  <p>Here's what my clients have to say about me:</p>
</div>

<!-- Review Slider using Swiper -->
<div class="client-item-container">
  <!-- Swiper -->
  <div class="swiper mySwiper" id="reviewSwiper">
    <div class="swiper-wrapper" id="reviewWrapper">
      
      <!-- Static sample reviews (can be removed if only using API) -->
       <div class="swiper-slide">
        <div class="review-content">
          <p class="client-name"></p>
          <p class="client-position"></p>
          <p class="client-review"></p>
        </div>
      </div>
      </div>
   
      </div>
</div>

<!-- Footer -->
<div class="footer">

    </div>


 <script>
  // Initialize Swiper instance
let reviewSwiper;

function initReviewSwiper() {
  if (reviewSwiper) {
    reviewSwiper.destroy(true, true);
  }

  reviewSwiper = new Swiper('.mySwiper', {
    slidesPerView: 1,
    spaceBetween: 20,
    loop: false,
    breakpoints: {
      768: {slidesPerView: 2},
      1024: {slidesPerView: 3}
    }
  });
}
 


// Create a slide element for a review
function createReviewSlide(review) {
  const slide = document.createElement('div');
  slide.className = 'swiper-slide review-item';

  // Generate star icons based on rating
  let starsHTML = '';
  for (let i = 1; i <= 5; i++) {
    starsHTML += `<span class="${i <= review.rating ? 'filled' : 'empty'}">&#9733;</span>`;
  }

  slide.innerHTML = `
    <div class="review-content">
      <p class="client-name">${review.name}</p>
      <p class="client-position">${review.position}</p>
      <p class="client-review">"${review.review}"</p>
      <div class="client-rating">${starsHTML}</div>
    </div>
  `;
  return slide;
}

// Load reviews, create slides, and initialize Swiper
const API_URL = "https://ansq-website.onrender.com/api/reviews";

async function loadReviews() {
  const wrapper = document.getElementById("reviewWrapper");
  if (!wrapper) return;

  try {
    const response = await fetch(API_URL);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const reviews = await response.json();

    // Latest reviews first (if each review has a createdAt date)
    reviews.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    wrapper.replaceChildren(...reviews.map(createReviewSlide));

    if (reviewSwiper) reviewSwiper.destroy(true, true);
    reviewSwiper = new Swiper(".swiper", {
      slidesPerView: 1,
      spaceBetween: 20,
      loop: reviews.length > 1,
      autoplay: { delay: 3000, disableOnInteraction: false },
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev",
      },
      pagination: { el: ".swiper-pagination", clickable: true },
    });
  } catch (error) {
    console.error("Could not load reviews:", error);
  }
}

document.addEventListener("DOMContentLoaded", loadReviews);
</script>
<script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>

</body>
